<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#53664e"><title>上岸地图 · 离线</title><style>body{font-family:system-ui;background:#f8f9f5;color:#28342e;max-width:550px;margin:15vh auto;padding:30px;line-height:1.9}a{color:#53664e}button{padding:12px 20px;background:#53664e;color:white;border:0;border-radius:10px}</style><h1>暂时离线，也不用着急。</h1><p>这页还没有缓存。已经打开并缓存的 SOP 可以从下面继续阅读。</p><ul id="pages"></ul><p>本机笔记和错题仍在此浏览器中。联网后再次打开即可继续。</p><button onclick="location.reload()">再试一次</button><script>caches.keys().then(async names=>{const seen=new Set;for(const name of names){if(!name.startsWith('gaokao-quest'))continue;const c=await caches.open(name);for(const req of await c.keys()){const u=new URL(req.url);if(/^\/sop\/SOP\d{3}$/.test(u.pathname)&&!seen.has(u.pathname)){seen.add(u.pathname);const li=document.createElement('li'),a=document.createElement('a');a.href=u.pathname;a.textContent=u.pathname.split('/').pop();li.append(a);document.querySelector('#pages').append(li);}}}});</script></html>
